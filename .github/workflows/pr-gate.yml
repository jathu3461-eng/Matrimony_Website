name: Mukurtham Pull Request Gate

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

# Explicit permissions (principle of least privilege)
permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  NODE_VERSION: '20.x'
  # Test-only credentials — safe to embed in CI env block
  DATABASE_URL: mysql://root:test@localhost:3306/mukurtham_test
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-long
  JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-chars
  USE_MOCK_REDIS: 'false'

jobs:
  backend-quality:
    name: Backend — Quality, Security & Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: mukurtham_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma Client
        run: npm run prisma:generate
        working-directory: backend

      # TypeScript compile — BLOCKS merge on failure
      - name: TypeScript Compile Check
        run: npx tsc --noEmit
        working-directory: backend

      # Lint — informational only (no lint config exists yet; does not block)
      - name: ESLint Check
        run: npm run lint 2>&1 || echo "::warning::ESLint check had warnings/errors — review before production"
        working-directory: backend
        continue-on-error: true

      # Security audit — blocks on critical/high CVEs only
      - name: Security Audit (high+)
        run: npm audit --audit-level=high
        working-directory: backend
        continue-on-error: true   # audit-level violations are tracked but non-blocking until hardened

      # Tests — BLOCKS merge on failure
      - name: Unit & Integration Tests
        run: npm run test
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}

      # Upload coverage for review
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-${{ github.sha }}
          path: backend/coverage
          retention-days: 14

  frontend-quality:
    name: Frontend — Quality, Security & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      # TypeScript compile — BLOCKS merge on failure
      - name: TypeScript Compile Check
        run: npx tsc --noEmit
        working-directory: frontend

      # Lint — informational
      - name: ESLint Check
        run: npm run lint 2>&1 || echo "::warning::ESLint check had warnings/errors"
        working-directory: frontend
        continue-on-error: true

      # Security audit — informational
      - name: Security Audit (high+)
        run: npm audit --audit-level=high
        working-directory: frontend
        continue-on-error: true

      # Production build — BLOCKS merge on failure
      - name: Production Build Verification
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: frontend/.next
          retention-days: 7

  secret-scan:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for gitleaks

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
