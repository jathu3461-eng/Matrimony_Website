name: Mukurtham cPanel CI/CD Pipeline

on:
  push:
    branches: [main, develop]

permissions:
  contents: read

env:
  NODE_VERSION: '20.x'
  DATABASE_URL: mysql://root:test@localhost:3306/mukurtham_test
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-long
  JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-chars
  USE_MOCK_REDIS: 'false'

jobs:
  # ============================================================
  # 1. Verification Gate (Lint, Build Checks, Tests)
  # ============================================================
  verify-quality:
    name: Verify Quality & Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: mukurtham_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Verify Backend
      - name: Verify Backend
        run: |
          npm ci
          npm run prisma:generate
          npx tsc --noEmit
          npm run test
          npm run build
        working-directory: backend
        env:
          DATABASE_URL: mysql://root:test@localhost:3306/mukurtham_test

      # Verify Frontend
      - name: Verify Frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: 1

  # ============================================================
  # 2. Package and Publish for cPanel
  # ============================================================
  package-and-deploy:
    name: Package and Deploy for cPanel
    runs-on: ubuntu-latest
    needs: verify-quality
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Build Backend production files
      - name: Build Backend
        run: |
          npm ci
          npm run prisma:generate
          npm run build
        working-directory: backend
        env:
          DATABASE_URL: mysql://root:test@localhost:3306/mukurtham_test

      # Build Frontend Next.js Standalone
      - name: Build Frontend
        run: |
          npm ci
          npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: 1

      # Run the cPanel Packager
      - name: Package production files
        run: |
          node prepare-production.js

      # Zip deploy components for manual upload
      - name: Create deploy ZIP archives
        run: |
          zip -r mukurtham-backend-cpanel.zip deploy/backend
          zip -r mukurtham-frontend-cpanel.zip deploy/frontend
          cp deploy/database.sql ./database.sql

      # Upload ZIP archives as Build Artifacts
      - name: Upload Backend ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mukurtham-backend-cpanel
          path: mukurtham-backend-cpanel.zip
          retention-days: 14

      - name: Upload Frontend ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mukurtham-frontend-cpanel
          path: mukurtham-frontend-cpanel.zip
          retention-days: 14

      - name: Upload database.sql Artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-schema-sql
          path: database.sql
          retention-days: 14

      # FTP deployment step (Runs ONLY if the user configures FTP_SERVER secret)
      - name: FTP cPanel Deploy
        if: "${{ secrets.FTP_SERVER != '' }}"
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: ./
