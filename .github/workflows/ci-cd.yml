name: Mukurtham Production CI/CD Pipeline

on:
  push:
    branches: [main, develop]

# Principle of least privilege — only grant what each job needs
permissions:
  contents: read
  packages: write
  id-token: write

env:
  NODE_VERSION: '20.x'
  DOCKER_IMAGE_BACKEND: ghcr.io/jathu3461-eng/mukurtham_matrimony/backend
  DOCKER_IMAGE_FRONTEND: ghcr.io/jathu3461-eng/mukurtham_matrimony/frontend
  DATABASE_URL: mysql://root:test@localhost:3306/mukurtham_test
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-long
  JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-chars
  USE_MOCK_REDIS: 'false'

jobs:
  # ============================================================
  # Build and Test Verification Job
  # ============================================================
  build-and-test:
    name: Build & Test Verification
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: mukurtham_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Verify Backend: install, generate, type-check, test, build (all blocking)
      - name: Verify Backend
        run: |
          npm ci
          npm run prisma:generate
          npx tsc --noEmit
          npm run test
          npm run build
        working-directory: backend
        env:
          DATABASE_URL: mysql://root:test@localhost:3306/mukurtham_test

      # Verify Frontend builds and passes typechecking
      - name: Verify Frontend build
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: 1

  # ============================================================
  # Docker Image Build & Push Job
  # ============================================================
  docker-publish:
    name: Docker Build & Publish
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push Backend image
      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_BACKEND }}:latest
            ${{ env.DOCKER_IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push Frontend image
      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_FRONTEND }}:latest
            ${{ env.DOCKER_IMAGE_FRONTEND }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Deployment and Rolling Rollback Job
  # ============================================================
  deploy:
    name: Continuous Deployment & Verification
    runs-on: ubuntu-latest
    needs: docker-publish
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Copy the production docker-compose file to the server so it has the latest service configuration and GHCR image tags
      - name: Copy docker-compose.prod.yml to Server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "infrastructure/docker-compose.prod.yml"
          target: "/opt/mukurtham"
          strip_components: 1

      # Connects to target VM via SSH to run backup, pull images, run migrations, and spin up services
      - name: Deploy to Host Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/mukurtham

            # 1. Update tags in .env configuration for persistence
            touch .env
            sed -i '/^BACKEND_TAG=/d' .env
            sed -i '/^FRONTEND_TAG=/d' .env
            echo "BACKEND_TAG=${{ github.sha }}" >> .env
            echo "FRONTEND_TAG=${{ github.sha }}" >> .env

            # 2. Backup existing database before running migration
            docker compose -f docker-compose.prod.yml exec -T backend node infrastructure/scripts/backup-restore.js backup || true

            # 3. Pull new container images
            docker compose -f docker-compose.prod.yml pull

            # 4. Launch updated containers
            docker compose -f docker-compose.prod.yml up -d --no-deps backend frontend

            # 5. Run prisma database migrations on target
            docker compose -f docker-compose.prod.yml exec -T backend npx prisma db push --schema=dist/prisma/schema.prisma

            # 6. Clean up old images
            docker system prune -f

      # Setup checking environment on GitHub runner to hit the deployed target
      - name: Run Smoke Test Health Check
        run: |
          node infrastructure/scripts/health-check.js
        env:
          FRONTEND_URL: http://${{ secrets.PROD_SERVER_HOST }}:3000
          BACKEND_URL: http://${{ secrets.PROD_SERVER_HOST }}:8000

      # Trigger Automated Rollback if health checks fail
      - name: Trigger Automatic Rollback on Failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/mukurtham
            echo "💥 Smoke test failed! Initiating rolling rollback..."
            
            # Revert to last stable commit (using GIT tags or previous image version tag)
            docker compose -f docker-compose.prod.yml rollback || echo "No docker compose rollback built-in support. Reverting tags manually."
            
            # Restore the database backup
            LATEST_BACKUP=$(ls -t infrastructure/backups/*.sql | head -n 1)
            if [ ! -z "$LATEST_BACKUP" ]; then
              echo "Database rollback selected backup: $LATEST_BACKUP"
              docker compose -f docker-compose.prod.yml exec -T backend node infrastructure/scripts/backup-restore.js restore $(basename $LATEST_BACKUP)
            fi

      # Broadcast status via Webhook notifications (Slack/Discord webhook URLs)
      - name: Send Slack Notification (Success)
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TITLE: "🚀 Mukurtham Matrimony Deployment Success!"
          SLACK_COLOR: "good"

      - name: Send Slack Notification (Failure)
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TITLE: "🚨 Mukurtham Matrimony Deployment/Rollback Alert!"
          SLACK_COLOR: "danger"
