name: 🚀 Deploy to cPanel

on:
  push:
    branches:
      - main
      - master

jobs:
  # ─────────────────────────────────────────────────
  # JOB 1: Build & Deploy FRONTEND to cPanel public_html
  # ─────────────────────────────────────────────────
  deploy-frontend:
    name: 🌐 Build + FTP Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 1️⃣ Checkout Latest Code
        uses: actions/checkout@v4

      - name: 2️⃣ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 3️⃣ Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: 4️⃣ Build Production Bundle (Vite)
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: 5️⃣ FTP Deploy Frontend → public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./frontend/dist/
          server-dir: /public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

  # ─────────────────────────────────────────────────
  # JOB 2: Deploy BACKEND to cPanel (Node.js App via SSH)
  # ─────────────────────────────────────────────────
  deploy-backend:
    name: 🖥️ SSH Deploy Backend to cPanel
    runs-on: ubuntu-latest
    needs: deploy-frontend

    steps:
      - name: 1️⃣ Checkout Latest Code
        uses: actions/checkout@v4

      - name: 2️⃣ Deploy Backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            echo "📦 Pulling latest backend code..."
            cd ~/mukurtham-backend

            git pull origin main

            echo "📦 Installing production dependencies..."
            npm ci --omit=dev

            echo "🔄 Restarting Node.js app via cPanel..."
            if command -v pm2 &> /dev/null; then
              pm2 restart mukurtham-backend || pm2 start server.js --name mukurtham-backend
              pm2 save
            else
              # cPanel Passenger restart (touch tmp/restart.txt)
              mkdir -p tmp && touch tmp/restart.txt
            fi

            echo "✅ Backend deployed successfully!"
