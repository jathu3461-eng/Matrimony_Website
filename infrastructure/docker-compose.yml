version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mukurtham-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: mukurtham_matrimony
      MYSQL_USER: mukurtham_user
      MYSQL_PASSWORD: mukurtham_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: mukurtham-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
