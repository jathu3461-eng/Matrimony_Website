version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mukurtham-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-mukurtham_matrimony}
      MYSQL_USER: ${DB_USER:-mukurtham_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mukurtham_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mukurtham-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$DB_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: mukurtham-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mukurtham-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/jathu3461-eng/mukurtham_matrimony/backend:${BACKEND_TAG:-latest}
    container_name: mukurtham-backend
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - backend_backups:/app/infrastructure/backups
    networks:
      - mukurtham-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    image: ghcr.io/jathu3461-eng/mukurtham_matrimony/frontend:${FRONTEND_TAG:-latest}
    container_name: mukurtham-frontend
    restart: always
    ports:
      - "3000:3000"
    networks:
      - mukurtham-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
  redis_data:
  backend_backups:

networks:
  mukurtham-network:
    driver: bridge
